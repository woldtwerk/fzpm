version: 2

project_name: fzpm

builds:
  - main: ./cmd/fzpm
    binary: fzpm
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

# release-please writes the changelog and creates the release;
# GoReleaser only attaches the binaries to it.
changelog:
  disable: true

release:
  mode: keep-existing
