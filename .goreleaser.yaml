version: 2

project_name: fzpm

builds:
  - main: ./cmd/fzpm
    binary: fzpm
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

# Stable names: the self-update downloads
# releases/download/v<version>/fzpm_<os>_<arch>.tar.gz (.zip on Windows).
archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

# release-please writes the changelog and creates the release;
# GoReleaser only attaches the binaries to it.
changelog:
  disable: true

release:
  mode: keep-existing
